<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studify</title>
    <link rel="stylesheet" href="/style/style.css" />
    <link rel="stylesheet" href="/style/authpages.css" />
  </head>
  <body>
    <div class="form">
      <h1>Logue na sua conta</h1>
      <div class="input" id="input-email">
        <input type="text"/>
      </div>
      <div class="input input-password">
        <input type="password" id="password"/>
        <button class="toggle-pwd-visibility">
          <img src="./imgs/eye-closed.svg"/>
        </button>
      </div>
      <button class="primary">Login</button>
      <div class="social-media">
        <span>Ou logue com</span>
        <div class="options">
          <div class="option"></div>
          <div class="option"></div>
          <div class="option"></div>
        </div>
      </div>
    </div>
    <script defer>
        const passwordInputs = document.getElementsByClassName("input-password");

        for (let i = 0; i < passwordInputs.length; i++) {
          const element = passwordInputs[i];
          element.querySelector(".toggle-pwd-visibility").addEventListener("click", ()=>{
            const input = element.querySelector("#password")
            const togglePwd = element.querySelector(".toggle-pwd-visibility")
            const isOpen = input.type == "password"
            input.type = isOpen ? "text" : "password"
            togglePwd.querySelector("img").src = isOpen ? "./imgs/eye-open.svg" : "./imgs/eye-closed.svg" 
          })
        }
    </script>
  </body>
</html>
